name: Test & Lint

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  python-lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Generate ephemeral test salts and keys
        run: |
          python - << 'PY' >> "$GITHUB_ENV"
          import secrets
          print(f"PII_SALT=ci_test_salt_{secrets.token_hex(16)}")
          print(f"PII_ENCRYPTION_KEY={secrets.token_hex(32)}")
          print(f"LFED_STUDENT_SALT=ci_student_salt_{secrets.token_hex(16)}")
          print(f"LFED_STAFF_SALT=ci_staff_salt_{secrets.token_hex(16)}")
          PY

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: |
          ruff check oss_framework nl_query scripts training --output-format=github

      - name: Format check with black
        run: |
          black --check oss_framework nl_query scripts training

      - name: Run dashboard contract tests
        env:
          DUCKDB_DATABASE_PATH: /tmp/ci_contracts.duckdb
        run: |
          python scripts/contracts/contract_tests.py

      - name: Test with pytest
        run: |
          pytest oss_framework/tests nl_query/tests

  desktop-ui-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: desktop/ui/package-lock.json

      - name: Install UI dependencies
        run: npm --prefix desktop/ui ci

      - name: Run UI tests
        run: npm --prefix desktop/ui test -- --run

      - name: Build UI bundle
        run: npm --prefix desktop/ui run build

  desktop-rust-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux WebKitGTK dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev build-essential pkg-config libssl-dev

      - name: Set up Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - name: Run Rust unit & integration tests
        run: cargo test --manifest-path desktop/Cargo.toml --features bundled-duckdb

  dbt-smoke-test:
    runs-on: ubuntu-latest
    env:
      DUCKDB_DATABASE_PATH: "/tmp/ci_smoke.duckdb"
      STAGE1_PATH: "/tmp/ci_stage1"
      DLT_PIPELINES_DIR: "/tmp/ci_dlt"
      RILL_EXPORT_DIR: "/tmp/ci_rill"
      CDE_PUBLIC_SCHOOLS_PATH: "/tmp/ci_pubschls.txt"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Generate ephemeral test salts and keys
        run: |
          python - << 'PY' >> "$GITHUB_ENV"
          import secrets
          print(f"PII_SALT=ci_test_salt_{secrets.token_hex(16)}")
          print(f"PII_ENCRYPTION_KEY={secrets.token_hex(32)}")
          PY

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Seed synthetic Stage 1 & minimal CDE smoke fixtures
        run: |
          mkdir -p "$RILL_EXPORT_DIR"
          python oss_framework/pipelines/aeries_dlt_pipeline.py duckdb --test
          python - << 'PY'
          import os, duckdb
          cols = [
              "CDSCode","NCESDist","NCESSchool","StatusType","County","District","School",
              "Street","StreetAbr","City","Zip","State","MailStreet","MailStrAbr","MailCity",
              "MailZip","MailState","Phone","Ext","FaxNumber","WebSite","OpenDate","ClosedDate",
              "Charter","CharterNum","FundingType","DOC","DOCType","SOC","SOCType","EdOpsCode",
              "EdOpsName","EILCode","EILName","GSoffered","GSserved","Virtual","Magnet",
              "YearRoundYN","FederalDFCDistrictID","Latitude","Longitude","AdmFName","AdmLName",
              "LastUpDate","Multilingual"
          ]
          with open(os.environ["CDE_PUBLIC_SCHOOLS_PATH"], "w", encoding="utf-8") as fh:
              fh.write("\t".join(cols) + "\n")
          con = duckdb.connect(os.environ["DUCKDB_DATABASE_PATH"])
          con.execute("CREATE SCHEMA IF NOT EXISTS cde_raw")
          con.execute("""
              CREATE OR REPLACE TABLE cde_raw.cde_chronic_absenteeism_dashboard (
                  cds VARCHAR, schoolname VARCHAR, districtname VARCHAR, countyname VARCHAR,
                  rtype VARCHAR, studentgroup VARCHAR, reportingyear VARCHAR,
                  currnumer VARCHAR, currdenom VARCHAR, currstatus VARCHAR, statuslevel VARCHAR,
                  priornumer VARCHAR, priordenom VARCHAR, priorstatus VARCHAR, change VARCHAR,
                  change_level VARCHAR, color VARCHAR, box VARCHAR,
                  currnsizemet VARCHAR, priornsizemet VARCHAR, accountabilitymet VARCHAR,
                  smalldenom VARCHAR, dataerrorflag VARCHAR, charter_flag VARCHAR,
                  dass_flag VARCHAR, coe_flag VARCHAR, indicator VARCHAR, _loaded_at TIMESTAMP
              )
          """)
          con.execute("""
              CREATE OR REPLACE TABLE cde_raw.cde_suspension_dashboard (
                  cds VARCHAR, schoolname VARCHAR, districtname VARCHAR, countyname VARCHAR,
                  rtype VARCHAR, studentgroup VARCHAR, reportingyear VARCHAR,
                  currnumer VARCHAR, currdenom VARCHAR, currstatus VARCHAR, statuslevel VARCHAR,
                  priornumer VARCHAR, priordenom VARCHAR, priorstatus VARCHAR, change VARCHAR,
                  changelevel VARCHAR, color VARCHAR, box VARCHAR,
                  currnsizemet VARCHAR, priornsizemet VARCHAR, accountabilitymet VARCHAR,
                  smalldenom VARCHAR, dataerrorflag VARCHAR, certifyflag VARCHAR,
                  priorcertifyflag VARCHAR, charter_flag VARCHAR, dass_flag VARCHAR,
                  coe_flag VARCHAR, indicator VARCHAR, _loaded_at TIMESTAMP
              )
          """)
          con.execute("""
              CREATE OR REPLACE TABLE cde_raw.cde_ela_dashboard (
                  cds VARCHAR, schoolname VARCHAR, districtname VARCHAR, countyname VARCHAR,
                  rtype VARCHAR, studentgroup VARCHAR, reportingyear VARCHAR,
                  currdenom VARCHAR, currstatus VARCHAR, statuslevel VARCHAR,
                  currdenom_without_prloss VARCHAR, currstatus_without_prloss VARCHAR, num_prloss VARCHAR,
                  priordenom VARCHAR, priorstatus VARCHAR, change VARCHAR, changelevel VARCHAR,
                  color VARCHAR, box VARCHAR,
                  currprate_enrolled VARCHAR, currprate_tested VARCHAR, currprate VARCHAR,
                  priorprate_enrolled VARCHAR, priorprate_tested VARCHAR, priorprate VARCHAR,
                  currnsizemet VARCHAR, priornsizemet VARCHAR, accountabilitymet VARCHAR,
                  charter_flag VARCHAR, dass_flag VARCHAR, coe_flag VARCHAR,
                  hscutpoints VARCHAR, pairshare_method VARCHAR, indicator VARCHAR, _loaded_at TIMESTAMP
              )
          """)
          con.execute("""
              CREATE OR REPLACE TABLE cde_raw.cde_elpac_dashboard (
                  cds VARCHAR, schoolname VARCHAR, districtname VARCHAR, countyname VARCHAR,
                  rtype VARCHAR, studentgroup VARCHAR, reportingyear VARCHAR,
                  currnumer VARCHAR, currdenom VARCHAR, currstatus VARCHAR, statuslevel VARCHAR,
                  currprogressed VARCHAR, currmaintain_pl4 VARCHAR, currmaintain_oth VARCHAR,
                  currdeclined VARCHAR, curr95 VARCHAR, currprogressed_alternate VARCHAR,
                  currmaintain_pl3_alternate VARCHAR, currnotprognotmain_alternate VARCHAR,
                  priornumer VARCHAR, priordenom VARCHAR, priorstatus VARCHAR,
                  change VARCHAR, changelevel VARCHAR,
                  priorprogressed VARCHAR, priormaintain_pl4 VARCHAR, priormaintain_oth VARCHAR,
                  priordeclined VARCHAR, prior95 VARCHAR, priorprogressed_alternate VARCHAR,
                  priormaintain_pl3_alternate VARCHAR, priornotprognotmain_alternate VARCHAR,
                  color VARCHAR, box VARCHAR,
                  currnsizemet VARCHAR, priornsizemet VARCHAR, accountabilitymet VARCHAR,
                  flag95pct VARCHAR, priorflag95pct VARCHAR, certifyflag VARCHAR,
                  priorcertifyflag VARCHAR, dataerrorflag VARCHAR,
                  charter_flag VARCHAR, dass_flag VARCHAR, coe_flag VARCHAR,
                  indicator VARCHAR, _loaded_at TIMESTAMP
              )
          """)
          con.close()
          PY

      - name: Install dbt packages & run dbt build
        run: |
          dbt deps --project-dir oss_framework/dbt --profiles-dir oss_framework/dbt
          dbt build --project-dir oss_framework/dbt --profiles-dir oss_framework/dbt
